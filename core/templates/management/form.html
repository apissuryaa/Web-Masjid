{% extends 'base.html' %}
{% block title %}Tambah Pengurus – Panel{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl border p-6 shadow-sm max-w-xl">
  <h1 class="text-xl font-bold text-emerald-700 mb-4">Tambah Pengurus</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-center gap-2">
      <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700">
        ➕ Simpan
      </button>
      <a href="{% url 'mosque_profile' %}" class="px-4 py-2 rounded border hover:bg-gray-50">Batal</a>
    </div>
  </form>
</div>
{% endblock %}

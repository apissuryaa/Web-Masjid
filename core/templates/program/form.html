{% extends 'base.html' %}
{% block title %}Tambah Program – Panel{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="bg-emerald-700 px-6 py-5 flex items-center gap-3">
      <span class="text-2xl"><i data-lucide='calendar' class='inline-block w-1em h-1em'></i></span>
      <div>
        <h1 class="text-lg font-bold text-white">Tambah Program / Kegiatan</h1>
        <p class="text-emerald-200 text-xs mt-0.5">Tambahkan kegiatan atau program masjid</p>
      </div>
    </div>
    <form method="post" class="django-form p-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg transition shadow-sm">
          <i data-lucide='plus' class='inline-block w-1em h-1em'></i> Simpan
        </button>
        <a href="{% url 'dashboard' %}" class="px-4 py-2.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition text-gray-600">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
